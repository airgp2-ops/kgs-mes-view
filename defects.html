<!DOCTYPE html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta http-equiv='refresh' content='300'><title>불량 현황</title><style>

.nav{display:flex;align-items:center;gap:12px;margin:8px 0}.nav button{font-size:17px;padding:5px 15px;border:1px solid #ccc;background:#fff;border-radius:8px;color:#111}.nav button:disabled{opacity:.3}#dayLabel{font-weight:600;font-size:16px}h2{font-size:16px;margin:16px 0 8px}.auto{margin-top:8px;border-top:1px dashed #bbb;padding-top:6px}.opinion{font-weight:600;margin:4px 0}</style></head><body><div class='nav'><button id='btnPrev' onclick='moveDay(-1)'>◀</button><span id='dayLabel'></span><button id='btnNext' onclick='moveDay(1)'>▶</button></div><h1 id='dayTitle'></h1><section id='day0' style='display:none'><div class='sub'>날짜 20261112 · 스냅샷 2026-11-12 10:30:01</div><div class='names'>불량 달성율 <b>1300.0%</b> · 일 목표 26본 — <span style='color:#2e7d32'><b>달성</b></span></div><div class='card'><span class='spec'>215/45 R17 XLLPS71V6</span> — 1본<div><div class='lot'>11B09036B · B09 · CON (P05) · 가류 B10 · G 13.4</div></div></div><div class='card'><span class='spec'>175/60 R14 XLLTA51AT</span> — 1본<div><div class='lot'>11B04098C · B04 · LRO (P08) · 가류 C10 · 1.6</div></div></div><h2>동일규격 동일 불량현황</h2><div class='card'>해당 없음</div></section><script>var META=[{"label": "11월 12일 (목) · 오늘", "total": 2}];var cur=META.length-1;function showDay(i){cur=Math.max(0,Math.min(META.length-1,i));for(var k=0;k<META.length;k++){document.getElementById('day'+k).style.display=(k===cur?'block':'none');}document.getElementById('dayTitle').textContent='불량 현황 — 총 '+META[cur].total+'본';document.getElementById('dayLabel').textContent=META[cur].label;document.getElementById('btnPrev').disabled=(cur===0);document.getElementById('btnNext').disabled=(cur===META.length-1);}function moveDay(d){showDay(cur+d);}showDay(cur);</script></body></html>
